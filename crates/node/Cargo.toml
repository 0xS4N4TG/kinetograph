[package]
name = "kinetograph-node"
description = "Node-API addon exposing the Kinetograph renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kinetograph-core = { path = "../core" }
kinetograph-cli = { path = "../cli" }
napi = { version = "3.14.2", features = ["napi9"] }
napi-derive = "3.6.12"
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2.6.0"
