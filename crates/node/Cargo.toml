[package]
name = "kinetograph-node"
description = "Node-API addon exposing the Kinetograph renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["skia"]
skia = ["kinetograph-core/skia", "kinetograph-cli/skia"]
# Links the LGPL-only static ffmpeg that `scripts/build-ffmpeg.sh` builds (PKG_CONFIG_PATH, or FFMPEG_DIR on Windows)
# instead of the system's shared one. This is the build that is published; the default links whatever ffmpeg is installed.
ffmpeg-static = ["ffmpeg/static"]

[dependencies]
kinetograph-core = { path = "../core", default-features = false }
kinetograph-cli = { path = "../cli", default-features = false }
kinetograph-dom = { path = "../dom" }
kinetograph-rive = { path = "../rive" }
ffmpeg = { package = "ffmpeg-next", version = "9.0.0" }
napi = { version = "3.14.2", features = ["napi9"] }
napi-derive = "3.6.12"
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[build-dependencies]
napi-build = "2.6.0"
