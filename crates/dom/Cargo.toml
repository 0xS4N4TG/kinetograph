[package]
name = "kinetograph-dom"
description = "CSS styling and layout of a DOM (Blitz: Stylo, taffy, Parley), painted as Kinetograph scene layers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kinetograph-core = { path = "../core" }
# Blitz's DOM: Stylo for CSS, taffy for layout, Parley for text. No system fonts:
# a frame only sees the fonts the project registered (determinism).
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["svg", "woff", "floats", "text-transform-icu"] }
blitz-html = { version = "=0.3.0-beta.3", default-features = false }
blitz-traits = "=0.3.0-beta.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
# The painter (stream 2) reads Stylo's computed values and Blitz's Parley layouts.
# Same versions as blitz-dom, so the types are the same ones.
style = { package = "stylo", version = "0.22.0" }
style_traits = { package = "stylo_traits", version = "0.22.0" }
kurbo = "0.13.1"
parley = { version = "0.12.0", default-features = false, features = ["std"] }
taffy = { version = "0.15.0", default-features = false, features = ["std"] }
url = "2.5"
euclid = "0.22"
base64 = "0.23"
percent-encoding = "2.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
