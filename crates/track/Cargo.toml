[package]
name = "kinetograph-track"
description = "Motion tracking with Blender's tracker (libmv): points through a video, written as a .track.json"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libmv-sys = { path = "../libmv-sys" }
kinetograph-core = { path = "../core" }
peniko = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
# For CI: links the static LGPL ffmpeg the addon ships (crates/node), so the tests decode as the addon does.
ffmpeg = { package = "ffmpeg-next", version = "9.0.0", optional = true }

[features]
ffmpeg-static = ["dep:ffmpeg", "ffmpeg/static"]
