[package]
name = "kinetograph-core"
description = "Scene graph and GPU compositor for Kinetograph"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vello = "0.11.0"
parley = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
pollster = "0.4"
# The version wgpu 30 uses. Validates shaders on the CPU: the built-in ones in
# tests, and users' custom effect shaders when a scene loads.
naga = { version = "30.0.1", features = ["wgsl-in"] }
glam = "0.34.1"
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
