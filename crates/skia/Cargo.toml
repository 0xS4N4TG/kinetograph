# The optional Skia addon (`@kinetograph/skia`): its own workspace, so that the
# main workspace (`cargo build`, `cargo test`, `cargo clippy` at the root) never
# builds skia-safe. Build it from here (docs/AUTHORING.md §7.7).
[workspace]
resolver = "3"
members = ["render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
