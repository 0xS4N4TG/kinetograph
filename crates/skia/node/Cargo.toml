[package]
name = "kinetograph-skia-node"
description = "Node-API addon that draws React Native Skia scene trees with Skia (@kinetograph/skia)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kinetograph-skia = { path = "../render" }
skia-safe = "0.153.3"
napi = { version = "3.14.2", features = ["napi9"] }
napi-derive = "3.6.12"
serde_json = "1.0.154"
sha2 = "0.11.1"

[build-dependencies]
napi-build = "2.6.0"
