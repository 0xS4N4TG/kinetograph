[package]
name = "kinetograph-cli"
description = "Agent CLI for Kinetograph"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kinetograph"
path = "src/main.rs"

[dependencies]
kinetograph-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
ffmpeg = { package = "ffmpeg-next", version = "9.0.0" }
serde_json = "1.0.154"
