[package]
name = "kinetograph-cli"
description = "Agent CLI for Kinetograph"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kinetograph"
path = "src/main.rs"

[dependencies]
kinetograph-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
