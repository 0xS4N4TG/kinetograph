[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/node", "crates/dom"]
exclude = ["phase0"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Vello 0.11's fine shader loses low bits of an image's sample position by adding
# the image's atlas offset before splitting it into texel and fraction (#12);
# vello starts a compute pass for each of its dispatches, about 17 for each
# page; see vendor/README.md.
[patch.crates-io]
vello = { path = "vendor/vello" }
vello_shaders = { path = "vendor/vello_shaders" }
