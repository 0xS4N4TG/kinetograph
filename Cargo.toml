[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/node", "crates/dom", "crates/rive", "crates/libmv-sys", "crates/track"]
exclude = ["phase0"]

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "PolyForm-Small-Business-1.0.0"

# fontique 0.12 follows the requested weight on a variable font's `wght` axis;
# a face registered at one weight must stay at it, as a CSS @font-face with a
# single font-weight does (vendor/README.md).
#
# stylo's Servo build does not parse `@container`, and blitz-dom answers no
# container query: its `query_container_size` returns nothing (vendor/README.md).
[patch.crates-io]
blitz-dom = { path = "vendor/blitz-dom" }
stylo = { path = "vendor/stylo" }
fontique = { path = "vendor/fontique" }
parley = { path = "vendor/parley" }
