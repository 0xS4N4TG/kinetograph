<!doctype html>
<html>
<head><meta charset="utf-8"><style>
html { background: rgb(20, 30, 60); }
body { margin: 0; }
#host { position: absolute; left: 10px; top: 10px; }
</style></head>
<body>
<div id="root" data-composition-id="main" data-width="320" data-height="180" data-start="0" data-duration="1">
  <div id="host"></div>
</div>
<template id="t"><div id="card" style="width: 100px; height: 100px; background: rgb(200, 0, 0)"></div></template>
<script>
  var content = document.querySelector('#t').content;
  content.getElementById('card').style.background = 'rgb(0, 200, 0)';
  document.getElementById('host').appendChild(content.cloneNode(true));
</script>
</body>
</html>
