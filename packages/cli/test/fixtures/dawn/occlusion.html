<!doctype html><html><head><style>body{margin:0;background:#000}</style></head>
<body><div id="kg-root" data-composition-id="main" data-width="32" data-height="32" data-duration="12" style="position:relative;width:32px;height:32px;overflow:hidden"><canvas id="c" width="32" height="32"></canvas>
<script type="module">
// An occlusion query decides the colour of the NEXT frame, as three.js's occlusion example does: a small square slides out from behind
// a large one; the background is green when the last frame's query counted samples, red when it counted none. Frame N shows the
// result of frame N-1's draws, so a frame drawn alone is only right if the frame before it is drawn too.
const device = await (await navigator.gpu.requestAdapter()).requestDevice();
const context = document.getElementById('c').getContext('webgpu');
context.configure({ device, format: 'rgba8unorm', alphaMode: 'opaque' });
const module = device.createShaderModule({ code: `
  struct U { x: f32, z: f32, half: f32, pad: f32 }
  @group(0) @binding(0) var<uniform> u: U;
  @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
    var p = array<vec2f,6>(vec2f(-1,-1), vec2f(1,-1), vec2f(1,1), vec2f(-1,-1), vec2f(1,1), vec2f(-1,1));
    return vec4f(u.x + p[i].x * u.half, p[i].y * u.half, u.z, 1); }
  @fragment fn fs() -> @location(0) vec4f { return vec4f(1, 1, 1, 1); }` });
const pipeline = device.createRenderPipeline({ layout: 'auto', vertex: { module, entryPoint: 'vs' }, fragment: { module, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] },
  depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' } });
const uniforms = [0, 1].map(() => device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST }));
const groups = uniforms.map((buffer) => device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer } }] }));
device.queue.writeBuffer(uniforms[0], 0, new Float32Array([-0.5, 0.2, 0.5, 0])); // the large square, in front
const set = device.createQuerySet({ type: 'occlusion', count: 1 });
const resolve = device.createBuffer({ size: 8, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
let visible = true;
function frame(time) {
  const here = Math.round(time / (1000 / 30)); // the frame, from the animation-frame time
  // The small square starts hidden behind the large one (x -0.8) and moves right, out from behind it at x > -0.1.
  device.queue.writeBuffer(uniforms[1], 0, new Float32Array([-0.8 + here * 0.15, 0.6, 0.1, 0]));
  const depth = device.createTexture({ size: [32, 32], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({
    colorAttachments: [{ view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: visible ? { r: 0, g: 0.6, b: 0, a: 1 } : { r: 0.6, g: 0, b: 0, a: 1 } }],
    depthStencilAttachment: { view: depth.createView(), depthLoadOp: 'clear', depthStoreOp: 'discard', depthClearValue: 1 }, occlusionQuerySet: set });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, groups[0]); pass.draw(6);
  pass.setBindGroup(0, groups[1]); pass.beginOcclusionQuery(0); pass.draw(6); pass.endOcclusionQuery();
  pass.end();
  const read = device.createBuffer({ size: 8, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  encoder.resolveQuerySet(set, 0, 1, resolve, 0);
  encoder.copyBufferToBuffer(resolve, 0, read, 0, 8);
  device.queue.submit([encoder.finish()]);
  read.mapAsync(GPUMapMode.READ).then(() => { visible = new BigUint64Array(read.getMappedRange())[0] > 0n; read.destroy(); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></div></body></html>
