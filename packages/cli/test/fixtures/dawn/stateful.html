<!doctype html><html><head><style>body{margin:0;background:#000}</style></head>
<body><div id="kg-root" data-composition-id="main" data-width="256" data-height="256" data-duration="10" style="position:relative;width:256px;height:256px;overflow:hidden"><canvas id="c" width="256" height="256"></canvas>
<script type="module">
// Stateful on purpose: a ping-pong feedback texture (each frame reads the last one) and a compute pass that advances
// particles in a storage buffer (each frame reads the positions the last one wrote). Frame N is N steps of both.
const canvas = document.getElementById('c');
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const context = canvas.getContext('webgpu');
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format, alphaMode: 'premultiplied' });
const N = 512;
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) { const a = i * 2.399963; const r = 0.1 + 0.6 * ((i * 7919) % N) / N; init[i*4] = Math.cos(a) * r; init[i*4+1] = Math.sin(a) * r; init[i*4+2] = -Math.sin(a) * 0.01; init[i*4+3] = Math.cos(a) * 0.01; }
const particles = device.createBuffer({ size: init.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
device.queue.writeBuffer(particles, 0, init);
const stepBuf = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const compute = device.createComputePipeline({ layout: 'auto', compute: { entryPoint: 'main', module: device.createShaderModule({ code: `
  @group(0) @binding(0) var<storage, read_write> p: array<vec4f>;
  @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3u) {
    var v = p[id.x]; let g = -v.xy * 0.02; // pulled to the centre: state accumulates
    v.z += g.x; v.w += g.y; v.x += v.z; v.y += v.w; p[id.x] = v; } ` }) } });
const cbind = device.createBindGroup({ layout: compute.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: particles } }] });
const tex = [0, 1].map(() => device.createTexture({ size: [256, 256], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING }));
const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
const quad = device.createShaderModule({ code: `
  struct U { step: f32, pad: vec3f }
  @group(0) @binding(0) var src: texture_2d<f32>; @group(0) @binding(1) var smp: sampler; @group(0) @binding(2) var<uniform> u: U;
  @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f { var p = array<vec2f,3>(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3)); return vec4f(p[i], 0, 1); }
  @fragment fn fade(@builtin(position) pos: vec4f) -> @location(0) vec4f {
    let uv = pos.xy / 256.0; let prev = textureSample(src, smp, (uv - 0.5) * 0.99 + 0.5);
    let c = vec2f(0.5 + 0.3 * cos(u.step * 0.1), 0.5 + 0.3 * sin(u.step * 0.1));
    let d = distance(uv, c); let blob = vec3f(1.0, 0.5, 0.2) * smoothstep(0.05, 0.0, d);
    return vec4f(prev.rgb * 0.97 + blob, 1.0); }
  @fragment fn show(@builtin(position) pos: vec4f) -> @location(0) vec4f { return vec4f(textureSample(src, smp, pos.xy / 256.0).rgb, 1.0); }` });
const ubl = device.createBindGroupLayout({ entries: [
  { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: {} }, { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: {} }, { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: {} }] });
const layout = device.createPipelineLayout({ bindGroupLayouts: [ubl] });
const mk = (entry, fmt) => device.createRenderPipeline({ layout, vertex: { module: quad, entryPoint: 'vs' }, fragment: { module: quad, entryPoint: entry, targets: [{ format: fmt }] } });
const fade = mk('fade', 'rgba8unorm'), show = mk('show', format);
const binds = tex.map((t) => device.createBindGroup({ layout: ubl, entries: [{ binding: 0, resource: t.createView() }, { binding: 1, resource: sampler }, { binding: 2, resource: { buffer: stepBuf } }] }));
const dots = device.createShaderModule({ code: `
  struct O { @builtin(position) p: vec4f, @location(0) c: vec3f }
  @vertex fn vs(@location(0) pos: vec4f) -> O { var o: O; o.p = vec4f(pos.xy, 0, 1); o.c = vec3f(0.4, 0.8, 1.0); return o; }
  @fragment fn fs(o: O) -> @location(0) vec4f { return vec4f(o.c, 1); }` });
const dotPipe = device.createRenderPipeline({ layout: 'auto', vertex: { module: dots, entryPoint: 'vs', buffers: [{ arrayStride: 16, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }] }] },
  fragment: { module: dots, entryPoint: 'fs', targets: [{ format }] }, primitive: { topology: 'point-list' } });
let n = 0, cur = 0;
function frame() {
  device.queue.writeBuffer(stepBuf, 0, new Float32Array([n, 0, 0, 0]));
  const enc = device.createCommandEncoder();
  const cp = enc.beginComputePass(); cp.setPipeline(compute); cp.setBindGroup(0, cbind); cp.dispatchWorkgroups(N / 64); cp.end();
  const fp = enc.beginRenderPass({ colorAttachments: [{ view: tex[1 - cur].createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
  fp.setPipeline(fade); fp.setBindGroup(0, binds[cur]); fp.draw(3); fp.end();
  const sp = enc.beginRenderPass({ colorAttachments: [{ view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
  sp.setPipeline(show); sp.setBindGroup(0, binds[1 - cur]); sp.draw(3);
  sp.setPipeline(dotPipe); sp.setVertexBuffer(0, particles); sp.draw(1, N); sp.end();
  device.queue.submit([enc.finish()]);
  cur = 1 - cur; n++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></div></body></html>
