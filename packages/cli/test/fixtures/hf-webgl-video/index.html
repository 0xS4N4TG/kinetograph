<!doctype html>
<html>
  <head>
    <style>
      canvas { position: absolute; top: 0; }
    </style>
  </head>
  <body>
    <!-- A looping clip (clip.mp4: 12 fps, 24 pictures, each its own colour) uploaded to a WebGL texture every frame
         (raw texImage2D) and drawn on a 2D canvas (drawImage). Both must show the picture for the frame's virtual time. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="128" data-height="72" style="position: relative; width: 128px; height: 72px; overflow: hidden; background: #000">
      <canvas id="gl" width="64" height="72" style="left: 0"></canvas>
      <canvas id="flat" width="64" height="72" style="left: 64px"></canvas>
    </div>
    <script>
      const video = document.createElement('video');
      video.src = 'clip.mp4';
      video.loop = true;
      video.muted = true;
      video.play();

      const gl = document.getElementById('gl').getContext('webgl');
      const compile = (type, source) => {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
      };
      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, 'attribute vec2 p; varying vec2 uv; void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }'));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, 'precision mediump float; varying vec2 uv; uniform sampler2D tex; void main() { gl_FragColor = texture2D(tex, uv); }'));
      gl.linkProgram(program);
      gl.useProgram(program);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const at = gl.getAttribLocation(program, 'p');
      gl.enableVertexAttribArray(at);
      gl.vertexAttribPointer(at, 2, gl.FLOAT, false, 0, 0);
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const flat = document.getElementById('flat').getContext('2d');

      function draw() {
        requestAnimationFrame(draw);
        if (video.readyState < 2) return;
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        flat.drawImage(video, 0, 0, 64, 72);
      }
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
