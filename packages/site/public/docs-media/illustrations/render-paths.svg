<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" role="img">
<title>Three render paths</title>
<desc>Three rows. Remotion: you write TSX and React, a browser draws every frame, you get a video. HyperFrames: you write an HTML page with GSAP, a browser draws every frame, you get a video. Kinetograph: you write TSX or an HTML page, a Rust compositor draws every frame on the GPU, you get a video, with no browser.</desc>
<text x="24" y="42" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#1d1b18" text-anchor="start">Remotion</text>
