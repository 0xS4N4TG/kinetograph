<text x="24" y="382" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#2238c4" text-anchor="start">Kinetograph</text>
