<text x="477.5" y="332" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#8396ff" text-anchor="middle">=</text>
