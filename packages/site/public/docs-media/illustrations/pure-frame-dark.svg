<path d="M298 112 L288.0 117.5 L288.0 106.5 Z" fill="#ededf0" stroke="#ededf0" stroke-width="1" stroke-linejoin="round"/>
<rect x="300" y="66" width="150" height="92" rx="8" fill="#1f2438" stroke="#8396ff" stroke-width="2"/>
<text x="375" y="109" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#8396ff" text-anchor="middle">Render</text>
<text x="375" y="131" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="middle">pure function</text>
