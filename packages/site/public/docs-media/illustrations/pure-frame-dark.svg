<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" width="720" height="462" role="img">
<title>A frame is a pure function</title>
<desc>The project and a frame number go into the renderer, and a picture comes out. Rendering the same project and frame again, on another worker or out of order, gives the identical picture. The wall clock is not an input.</desc>
<rect x="24" y="36" width="190" height="66" rx="8" fill="#17171a" stroke="#ededf0" stroke-width="1.5"/>
<text x="119" y="66" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#ededf0" text-anchor="middle">Project</text>
<text x="119" y="88" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="middle">code, props, files</text>
<rect x="24" y="128" width="190" height="66" rx="8" fill="#17171a" stroke="#ededf0" stroke-width="1.5"/>
