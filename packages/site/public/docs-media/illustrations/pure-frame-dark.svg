<rect x="540.75" y="87.36" width="103.5" height="22.400000000000002" rx="3.375" fill="#ffffff" stroke="none" stroke-width="0"/>
<rect x="540.75" y="123.2" width="69.75" height="11.200000000000001" rx="3.375" fill="#f6c177" stroke="none" stroke-width="0"/>
