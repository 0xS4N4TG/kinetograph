<circle cx="46" cy="428" r="14" fill="none" stroke="#ff6b5e" stroke-width="2.5"/>
<path d="M36.2 437.8 L55.8 418.2" stroke="#ff6b5e" stroke-width="2.5" stroke-linecap="round"/>
<text x="72" y="433" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start">No wall clock. Date.now(), Math.random() and timers follow the frame.</text>
