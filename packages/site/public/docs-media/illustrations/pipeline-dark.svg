<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img">
<title>How a project becomes a video</title>
<desc>Five steps from top to bottom: your project (TSX or an HTML page), Node runs it for each frame with the React reconciler or the HyperFrames runtime, the result is scene JSON, a Rust GPU compositor in an N-API addon draws it, and FFmpeg encodes the video. A dashed outline marks the whole path as having no browser.</desc>
<rect x="14" y="14" width="692" height="662" rx="18" fill="none" stroke="#8396ff" stroke-width="1.5" stroke-dasharray="7 6"/>
<rect x="40" y="36" width="40" height="28" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
<path d="M40 43 H80" stroke="#a1a1aa" stroke-width="1.5"/>
<circle cx="46" cy="39.5" r="1.3" fill="#a1a1aa"/>
<circle cx="51" cy="39.5" r="1.3" fill="#a1a1aa"/>
<circle cx="56" cy="39.5" r="1.3" fill="#a1a1aa"/>
<circle cx="60" cy="50" r="24" fill="none" stroke="#ff6b5e" stroke-width="2.5"/>
<path d="M43.2 66.8 L76.8 33.2" stroke="#ff6b5e" stroke-width="2.5" stroke-linecap="round"/>
<text x="100" y="56" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#ededf0" text-anchor="start">No browser in the render path</text>
<rect x="44" y="100" width="632" height="70" rx="8" fill="#17171a" stroke="#ededf0" stroke-width="1.5"/>
<circle cx="72" cy="135" r="13" fill="#8396ff"/>
<text x="72" y="140" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#0b0c14" text-anchor="middle">1</text>
<text x="98" y="142" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#ededf0" text-anchor="start">Your project</text>
<text x="660" y="141" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="end">TSX with Remotion’s API, or an HTML page</text>
<path d="M360 173 L360 203" fill="none" stroke="#ededf0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M360 203 L354.5 193.0 L365.5 193.0 Z" fill="#ededf0" stroke="#ededf0" stroke-width="1" stroke-linejoin="round"/>
<text x="374" y="193" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start">for every frame</text>
<rect x="44" y="206" width="632" height="70" rx="8" fill="#17171a" stroke="#ededf0" stroke-width="1.5"/>
<circle cx="72" cy="241" r="13" fill="#8396ff"/>
<text x="72" y="246" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#0b0c14" text-anchor="middle">2</text>
<text x="98" y="248" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#ededf0" text-anchor="start">Node runs it</text>
<text x="660" y="247" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="end">React reconciler or HyperFrames runtime</text>
