<path d="M360 309 L354.5 299.0 L365.5 299.0 Z" fill="#ededf0" stroke="#ededf0" stroke-width="1" stroke-linejoin="round"/>
<text x="374" y="299" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start">JSON</text>
<rect x="44" y="312" width="632" height="70" rx="8" fill="#17171a" stroke="#ededf0" stroke-width="1.5"/>
<circle cx="72" cy="347" r="13" fill="#8396ff"/>
<text x="72" y="352" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#0b0c14" text-anchor="middle">3</text>
<text x="98" y="354" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#ededf0" text-anchor="start">Scene JSON</text>
