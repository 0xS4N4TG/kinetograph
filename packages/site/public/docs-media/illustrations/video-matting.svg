<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img">
<title>Video matting</title>
<desc>A video goes through a model that runs once before rendering. It writes a foreground, the subject with alpha, and a base, the original picture. Layered back to front, the base, then text, then the foreground, give a result with the text behind the subject.</desc>
<rect x="24" y="50" width="150" height="80" rx="8" fill="#fbf8f0" stroke="#1d1b18" stroke-width="1.5"/>
<text x="99" y="87" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#1d1b18" text-anchor="middle">Video</text>
<text x="99" y="109" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#5e5952" text-anchor="middle">original.mp4</text>
<rect x="236" y="50" width="190" height="80" rx="8" fill="#e4e8f8" stroke="#2238c4" stroke-width="2"/>
<text x="331" y="87" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#2238c4" text-anchor="middle">Model</text>
<text x="331" y="109" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#5e5952" text-anchor="middle">once, before render</text>
<path d="M178 90 L232 90" fill="none" stroke="#1d1b18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M232 90 L222.0 95.5 L222.0 84.5 Z" fill="#1d1b18" stroke="#1d1b18" stroke-width="1" stroke-linejoin="round"/>
<rect x="496" y="20" width="200" height="68" rx="8" fill="#fbf8f0" stroke="#1d1b18" stroke-width="1.5"/>
<text x="596" y="51" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#1d1b18" text-anchor="middle">Foreground</text>
<text x="596" y="73" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#5e5952" text-anchor="middle">subject with alpha</text>
<rect x="496" y="108" width="200" height="68" rx="8" fill="#fbf8f0" stroke="#1d1b18" stroke-width="1.5"/>
<text x="596" y="139" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#1d1b18" text-anchor="middle">Base</text>
<text x="596" y="161" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#5e5952" text-anchor="middle">original, opaque</text>
<path d="M430 90 L468 90 L468 54 L492 54" fill="none" stroke="#1d1b18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M492 54 L482.0 59.5 L482.0 48.5 Z" fill="#1d1b18" stroke="#1d1b18" stroke-width="1" stroke-linejoin="round"/>
<path d="M468 90 L468 142 L492 142" fill="none" stroke="#1d1b18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M492 142 L482.0 147.5 L482.0 136.5 Z" fill="#1d1b18" stroke="#1d1b18" stroke-width="1" stroke-linejoin="round"/>
<text x="24" y="226" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#1d1b18" text-anchor="start">Layers, back to front</text>
<rect x="33" y="246" width="135" height="100" rx="6" fill="#fbf8f0" stroke="#1d1b18" stroke-width="1.5"/>
<text x="100.5" y="370" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#1d1b18" text-anchor="middle">base</text>
<text x="100.5" y="390" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5e5952" text-anchor="middle">bottom</text>
<text x="187" y="304" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#2238c4" text-anchor="middle">+</text>
<rect x="206" y="246" width="135" height="100" rx="6" fill="#fbf8f0" stroke="#1d1b18" stroke-width="1.5"/>
<text x="273.5" y="370" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#1d1b18" text-anchor="middle">text</text>
<text x="273.5" y="390" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5e5952" text-anchor="middle">middle</text>
<text x="360" y="304" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#2238c4" text-anchor="middle">+</text>
<rect x="379" y="246" width="135" height="100" rx="6" fill="none" stroke="#1d1b18" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="446.5" y="370" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#1d1b18" text-anchor="middle">foreground</text>
<text x="446.5" y="390" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5e5952" text-anchor="middle">top</text>
<text x="533" y="304" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#2238c4" text-anchor="middle">=</text>
<rect x="552" y="246" width="135" height="100" rx="6" fill="#fbf8f0" stroke="#1d1b18" stroke-width="1.5"/>
<text x="619.5" y="370" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#1d1b18" text-anchor="middle">result</text>
<text x="619.5" y="390" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#5e5952" text-anchor="middle">text behind subject</text>
<circle cx="100.5" cy="291.7" r="15.75" fill="#8a847a"/>
<path d="M64.8 340 C64.8 316.9 81.6 310.6 100.5 310.6 C119.4 310.6 136.2 316.9 136.2 340 Z" fill="#8a847a"/>
<text x="273.5" y="308" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="26" font-weight="800" fill="#2238c4" text-anchor="middle">BEHIND</text>
<circle cx="446.5" cy="291.7" r="15.75" fill="#8a847a"/>
<path d="M410.8 340 C410.8 316.9 427.6 310.6 446.5 310.6 C465.4 310.6 482.2 316.9 482.2 340 Z" fill="#8a847a"/>
<text x="619.5" y="308" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="26" font-weight="800" fill="#2238c4" text-anchor="middle">BEHIND</text>
<circle cx="619.5" cy="291.7" r="15.75" fill="#8a847a"/>
<path d="M583.8 340 C583.8 316.9 600.6 310.6 619.5 310.6 C638.4 310.6 655.2 316.9 655.2 340 Z" fill="#8a847a"/>
<text x="24" y="440" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5e5952" text-anchor="start">Rendering never runs the model, so every render comes out the same.</text>
</svg>
