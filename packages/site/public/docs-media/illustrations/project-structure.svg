<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img">
<title>What kinetograph init writes</title>
<desc>A project folder with src for your code (index.tsx, scenes/Title.tsx, components, lib), public for images, fonts, audio and video, and out for everything the commands write: stills, sheets and renders. package.json, tsconfig.json and .gitignore sit beside them.</desc>
<text x="24" y="34" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1d1b18" text-anchor="start">my-video/</text>
<rect x="24" y="54" width="672" height="214" rx="8" fill="#fbf8f0" stroke="#1d1b18" stroke-width="1.5"/>
<path d="M44 76 a4 4 0 0 1 4 -4 h10 l5 5 h14 a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 h-29 a4 4 0 0 1 -4 -4 Z" fill="none" stroke="#1d1b18" stroke-width="1.5" stroke-linejoin="round"/>
<text x="94" y="94" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1d1b18" text-anchor="start">src/</text>
<text x="676" y="94" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5e5952" text-anchor="end">your code</text>
<text x="64" y="134" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#1d1b18" text-anchor="start">index.tsx</text>
<text x="290" y="134" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5e5952" text-anchor="start">registerRoot and the compositions</text>
<text x="64" y="162" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#1d1b18" text-anchor="start">scenes/Title.tsx</text>
<text x="290" y="162" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5e5952" text-anchor="start">the starter scene</text>
<text x="64" y="190" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#1d1b18" text-anchor="start">components/</text>
<text x="290" y="190" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5e5952" text-anchor="start">pieces used by more than one scene</text>
<text x="64" y="218" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#1d1b18" text-anchor="start">lib/</text>
<text x="290" y="218" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5e5952" text-anchor="start">helpers</text>
<text x="64" y="246" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#1d1b18" text-anchor="start">google-fonts.d.ts</text>
<text x="290" y="246" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5e5952" text-anchor="start">types for font imports</text>
