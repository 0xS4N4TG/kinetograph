<path d="M44 308 a4 4 0 0 1 4 -4 h10 l5 5 h14 a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 h-29 a4 4 0 0 1 -4 -4 Z" fill="none" stroke="#1d1b18" stroke-width="1.5" stroke-linejoin="round"/>
<text x="94" y="326" font-family="'JetBrains Mono Variable','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1d1b18" text-anchor="start">public/</text>
