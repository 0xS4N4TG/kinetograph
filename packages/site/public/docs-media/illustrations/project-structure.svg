<text x="290" y="528" font-family="'DM Sans Variable','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" fill="#5e5952" text-anchor="start">from strip and onion</text>
