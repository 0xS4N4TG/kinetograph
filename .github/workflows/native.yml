# Builds the native addon (Rust, Skia, ffmpeg) on macOS, Linux and Windows, then installs it the way a user would and
# renders a few frames. The Linux and Windows builds had never been run when this file was written: expect to fix them.
name: native

on:
  # main only: a branch is built through its pull request, so a push to one does not build twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The ffmpegs that scripts/build-ffmpeg.sh (LGPL, linked into the addon) and scripts/build-ffmpeg-gpl.sh (GPL, the
  # separate bin/ffmpeg program) build, and their cache key part.
  FFMPEG_CACHE_VERSION: v4

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Build dependencies. Skia needs no source build: rust-skia publishes graphite + vulkan (Linux, Windows) and
      # graphite + metal (macOS) binaries. dotlottie's ThorVG is compiled with clang++, ffmpeg-sys-next's bindings with
      # libclang, openh264 and libvpx (x86) with nasm.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config nasm make git cmake

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf cmake

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: >-
            make
            diffutils
            git
            pkgconf
            nasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-make

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_CACHE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      # LGPL-only static ffmpeg (no libx264/libx265), see the header of the script.
      - name: Build ffmpeg (macOS, Linux)
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"

      # MSVC's compiler on the PATH first, then ffmpeg's configure from MSYS2. MSYS2's link.exe would shadow MSVC's.
      - name: Load the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          rm -f /usr/bin/link.exe
          scripts/build-ffmpeg.sh "$(cygpath -u "$RUNNER_TEMP")/ffmpeg"

      # The GPL ffmpeg program that ships in the platform package as bin/ffmpeg, for libx264 and libx265. A separate
      # executable the addon runs as a child process; never linked. It builds with gcc (MinGW-w64 on Windows).
      - name: Cache the GPL ffmpeg
        id: ffmpeg-gpl-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-gpl
          key: ffmpeg-gpl-${{ env.FFMPEG_CACHE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg-gpl.sh') }}

      - name: Build the GPL ffmpeg (macOS, Linux)
        if: runner.os != 'Windows' && steps.ffmpeg-gpl-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg-gpl.sh "$RUNNER_TEMP/ffmpeg-gpl"

      - name: Build the GPL ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-gpl-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg-gpl.sh "$(cygpath -u "$RUNNER_TEMP")/ffmpeg-gpl"

      # Into the platform package, where npm packs it from (ignored by the repository) and where the CLI looks for it.
      - name: Place the GPL ffmpeg in the platform package
        shell: bash
        run: |
          d=crates/node/npm/${{ matrix.platform }}/bin
          mkdir -p "$d"
          cp "$RUNNER_TEMP"/ffmpeg-gpl/bin/ffmpeg* "$d/"
          cp "$RUNNER_TEMP/ffmpeg-gpl/SOURCES.txt" "$d/SOURCES.txt"
          ls -l "$d"
          "$d"/ffmpeg* -hide_banner -version | head -3
          "$d"/ffmpeg* -hide_banner -encoders | grep -E 'libx264|libx265|libvpx'
          "$d"/ffmpeg* -hide_banner -encoders | grep libx264
          # Raw pictures in on a pipe, an H.264 file out: how the addon uses it.
          head -c 115200 /dev/zero | "$d"/ffmpeg* -hide_banner -loglevel error -f rawvideo -pix_fmt yuv420p -s 160x120 -framerate 30 -i pipe:0 -c:v libx264 -f mp4 "$RUNNER_TEMP/probe.mp4"
          test -s "$RUNNER_TEMP/probe.mp4"

      # ANGLE (the OpenGL ES library WebGL pages run on by default) for the platform package's angle/
      # folder, where the addon finds it and npm packs it from (ignored by the repository). The source is the one
      # DEFAULT_SOURCE in scripts/fetch-angle.mjs names; every file is checked against a SHA-256 pinned there. Linux and
      # Windows packages also hold SwiftShader (and the Vulkan loader) for servers with no GPU; macOS always has Metal.
      - name: Fetch ANGLE for the platform package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            node scripts/fetch-angle.mjs ${{ matrix.platform }}
          else
            node scripts/fetch-angle.mjs ${{ matrix.platform }} --swiftshader
          fi
          ls -l crates/node/npm/${{ matrix.platform }}/angle

      # Dawn (WebGPU, KINETOGRAPH_WEBGPU=dawn): dawn.node of the pinned `webgpu` npm package for the platform package's dawn/ folder,
      # checked against the package's integrity and a SHA-256 per file (scripts/fetch-dawn.mjs).
      - name: Fetch Dawn for the platform package
        shell: bash
        run: |
          node scripts/fetch-dawn.mjs ${{ matrix.platform }}
          ls -l crates/node/npm/${{ matrix.platform }}/dawn

      - run: npm ci

      - name: Build the addon (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: npm run build:release -w @kinetographdev/native -- --target ${{ matrix.target }} --features ffmpeg-static

      # Windows only: keep line tables in the PDB next to the DLL (MSVC writes debug info to a PDB, never into the DLL),
      # so a crash stack a user pastes (crates/node/src/crash_report.rs) can be turned into function names. Debug info
      # does not change the generated code. The crash test below uses the same setting so it reuses this build's crates.
      - name: Build the addon (Windows)
        if: runner.os == 'Windows'
        env:
          FFMPEG_DIR: ${{ runner.temp }}\ffmpeg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: npm run build:release -w @kinetographdev/native -- --target ${{ matrix.target }} --features ffmpeg-static

      - name: Upload the addon's PDB (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: pdb-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/kinetograph_node.pdb
          retention-days: 90
          if-no-files-found: error

      # The Windows crash report (PR #155): a vectored exception handler that prints the code, the module and the stack.
      # Its test raises an access violation and checks the report; it ran nowhere before this step.
      - name: Test the crash report (Windows)
        if: runner.os == 'Windows'
        env:
          FFMPEG_DIR: ${{ runner.temp }}\ffmpeg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo test --release --target ${{ matrix.target }} -p kinetograph-node --features ffmpeg-static --test crash_report -- --nocapture

      # The matting crate (crates/matte) does not link ONNX Runtime: it opens the library at run time (`ort`'s load-dynamic),
      # so a build here needs none, and the addon loads on this runner's glibc whatever ONNX Runtime needs. Its tests cover
      # the pre- and post-processing and run no model (the BEN2 step after them runs one, with the library downloaded first).
      #
      # Blender's tracker (libmv, Ceres and Eigen, crates/libmv-sys) is C++ that the cc crate builds into the addon: GCC
      # on Linux, MSVC on Windows, clang on macOS. The tests track synthetic pictures, and real footage against the
      # platform's golden (crates/track/tests/goldens; a platform without one prints what it got). Same target and
      # features as the addon build, so the Rust dependencies are reused.
      - name: Test the tracker and matting (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: cargo test --release --target ${{ matrix.target }} -p libmv-sys -p kinetograph-track -p kinetograph-matte --features kinetograph-track/ffmpeg-static,kinetograph-matte/ffmpeg-static -- --nocapture

      - name: Test the tracker and matting (Windows)
        if: runner.os == 'Windows'
        env:
          FFMPEG_DIR: ${{ runner.temp }}\ffmpeg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo test --release --target ${{ matrix.target }} -p libmv-sys -p kinetograph-track -p kinetograph-matte --features kinetograph-track/ffmpeg-static,kinetograph-matte/ffmpeg-static -- --nocapture

      # WebGL through ANGLE (crates/dom/tests/webgl.rs) on ANGLE's SwiftShader backend, the CPU
      # rasteriser: these runners have no GPU. SwiftShader is not in the platform package (the files are 6 to 21 MB and the
      # package does not ship them), so they come from our ANGLE release into a folder of their own. There is no Chrome
      # here, so a case is held to "drew without an unsupported call"; ANGLE's goldens are Metal's (tests/golden/angle)
      # and are not compared on this backend.
      - name: Fetch ANGLE with SwiftShader (for the tests)
        shell: bash
        run: node scripts/fetch-angle.mjs ${{ matrix.platform }} --swiftshader --out "$RUNNER_TEMP/angle-swiftshader"

      # The compositor the WebGL cases draw through is wgpu, which needs a Vulkan device of its own: lavapipe, as in the
      # smoke job. ANGLE's SwiftShader is separate and comes with ANGLE.
      - name: Install a Vulkan driver for the compositor (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Test WebGL on ANGLE SwiftShader (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          KINETOGRAPH_ANGLE_BACKEND: swiftshader
          KINETOGRAPH_ANGLE_DIR: ${{ runner.temp }}/angle-swiftshader
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: cargo test --release --target ${{ matrix.target }} -p kinetograph-dom --features ffmpeg-static --test webgl -- --nocapture

      - name: Test WebGL on ANGLE SwiftShader (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        env:
          KINETOGRAPH_ANGLE_BACKEND: swiftshader
          KINETOGRAPH_ANGLE_DIR: ${{ runner.temp }}\angle-swiftshader
          FFMPEG_DIR: ${{ runner.temp }}\ffmpeg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        # The compositor the cases draw through is wgpu, which found no Vulkan device here and fell back to Skia on the
        # CPU (about 1.5 minutes a case). The runner is elevated, so the loader ignores VK_DRIVER_FILES; the SwiftShader
        # ANGLE ships is registered as a driver the way an installer does, and the loader on the system path finds it.
        run: |
          $icd = "$env:RUNNER_TEMP\angle-swiftshader\vk_swiftshader_icd.json"
          New-Item -Path HKLM:\SOFTWARE\Khronos\Vulkan\Drivers -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\Khronos\Vulkan\Drivers -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
          # SwiftShader draws slowly here, so this runner takes a subset (Linux and macOS run every case): textures, framebuffers,
          # blending, integer and compressed formats, instancing, uniform buffers, multisampling, and a frame not depending on the last.
          cargo test --release --target ${{ matrix.target }} -p kinetograph-dom --features ffmpeg-static --test webgl -- --nocapture --exact webgl_texture webgl_framebuffer webgl2_mrt webgl2_float_blend webgl2_int_texture webgl2_compressed webgl2_divisor2 webgl2_ubo_shared webgl2_msaa_resolve webgl2_texture_layers a_frame_does_not_depend_on_what_the_thread_drew_before

      # ANGLE on the Mac's own GPU through Metal, from the very files the package ships. Its goldens were recorded on an
      # M4; this runner's (virtual) GPU may round differently, so a failure here does not fail the build until a run has
      # shown it holds.
      - name: Test WebGL on ANGLE Metal (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          KINETOGRAPH_ANGLE_DIR: ${{ github.workspace }}/crates/node/npm/${{ matrix.platform }}/angle
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: cargo test --release --target ${{ matrix.target }} -p kinetograph-dom --features ffmpeg-static --test webgl -- --nocapture

      # ONNX Runtime for the BEN2 step: Microsoft's CPU release, the version and SHA-256 that
      # packages/video-matting/src/registry.ts pins (users get it from the same release on the first use of matting). Its
      # CoreML is on macOS; Windows and Linux run on the CPU.
      - name: Download ONNX Runtime
        shell: bash
        run: |
          v=1.31.0
          case "$RUNNER_OS" in
            macOS) f=onnxruntime-osx-arm64-$v.tgz; sha=1031b36dd3bdaa8d976a6130d9cf2a05e9be320b93ae804f8427b91dc3432afc; lib=libonnxruntime.$v.dylib ;;
            Linux) f=onnxruntime-linux-x64-$v.tgz; sha=cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57; lib=libonnxruntime.so.$v ;;
            Windows) f=onnxruntime-win-x64-$v.zip; sha=3958d8a44984160692c1b4ffd0de3cb48f8c39f9d34bb31e433db06e30b82195; lib=onnxruntime.dll ;;
          esac
          mkdir -p "$RUNNER_TEMP/ort"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$RUNNER_TEMP/$f" "https://github.com/microsoft/onnxruntime/releases/download/v$v/$f"
          echo "$sha  $RUNNER_TEMP/$f" | (sha256sum -c - || shasum -a 256 -c -)
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows's own bsdtar reads zip; Git's GNU tar does not, nor a drive-letter path.
            /c/Windows/System32/tar.exe -xf "$(cygpath -w "$RUNNER_TEMP/$f")" -C "$(cygpath -w "$RUNNER_TEMP/ort")" "onnxruntime-win-x64-$v/lib/onnxruntime.dll" "onnxruntime-win-x64-$v/lib/onnxruntime_providers_shared.dll"
            echo "ORT_DYLIB_PATH=$(cygpath -w "$RUNNER_TEMP/ort/onnxruntime-win-x64-$v/lib/$lib")" >> "$GITHUB_ENV"
          else
            tar -xf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/ort" "${f%.tgz}/lib/$lib"
            echo "ORT_DYLIB_PATH=$RUNNER_TEMP/ort/${f%.tgz}/lib/$lib" >> "$GITHUB_ENV"
          fi

      # One real model run on each platform: BEN2 (the revision and SHA-256 are the ones in packages/video-matting/src/registry.ts)
      # on the Fred Ott frame in the repository. It runs on ONNX Runtime's CPU here (CoreML on macOS). Not a
      # download users get from CI: the weights are fetched for this test only, and are not cached or kept.
      - name: Test BEN2 on a real frame (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$RUNNER_TEMP/ben2.onnx" https://huggingface.co/onnx-community/BEN2-ONNX/resolve/c552aa82688edce09f0ac9d2e31ad53d9d629010/onnx/model_fp16.onnx
          echo "dfdc25f421f32a0d1268e0f2ff2153d340e8f1d52d3dd16f5dc33c1ce85cedf1  $RUNNER_TEMP/ben2.onnx" | (sha256sum -c - || shasum -a 256 -c -)
          KINETOGRAPH_BEN2="$RUNNER_TEMP/ben2.onnx" cargo test --release --target ${{ matrix.target }} -p kinetograph-matte --features kinetograph-matte/ffmpeg-static --test person ben2_holds_the_man -- --nocapture

      # PowerShell, like the other Windows cargo steps: in Git Bash, /usr/bin/link shadows MSVC's link.exe.
      - name: Test BEN2 on a real frame (Windows)
        if: runner.os == 'Windows'
        env:
          FFMPEG_DIR: ${{ runner.temp }}\ffmpeg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'ben2.onnx'
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o $model https://huggingface.co/onnx-community/BEN2-ONNX/resolve/c552aa82688edce09f0ac9d2e31ad53d9d629010/onnx/model_fp16.onnx
          if ((Get-FileHash $model -Algorithm SHA256).Hash.ToLower() -ne 'dfdc25f421f32a0d1268e0f2ff2153d340e8f1d52d3dd16f5dc33c1ce85cedf1') { throw 'BEN2 SHA-256 mismatch' }
          $env:KINETOGRAPH_BEN2 = $model
          cargo test --release --target ${{ matrix.target }} -p kinetograph-matte --features kinetograph-matte/ffmpeg-static --test person ben2_holds_the_man -- --nocapture

      - name: Libraries the addon links
        shell: bash
        run: |
          f=crates/node/kinetograph.${{ matrix.platform }}.node
          ls -l "$f"
          case "$RUNNER_OS" in
            macOS) otool -L "$f" ;;
            Linux) ldd "$f" ;;
            Windows) dumpbin //dependents "$f" || true ;;
          esac
          # ONNX Runtime is opened at run time, never linked: the addon must not depend on it.
          case "$RUNNER_OS" in
            macOS) deps=$(otool -L "$f") ;;
            Linux) deps=$(ldd "$f") ;;
            Windows) deps=$(dumpbin //dependents "$f" || true) ;;
          esac
          if echo "$deps" | grep -qi onnxruntime; then echo "the addon links ONNX Runtime"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.platform }}
          path: |
            crates/node/kinetograph.${{ matrix.platform }}.node
            crates/node/npm/${{ matrix.platform }}/bin
            crates/node/npm/${{ matrix.platform }}/angle
            crates/node/npm/${{ matrix.platform }}/dawn
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    # Windows runners have no GPU and no Vulkan driver: wgpu uses Direct3D 12 (WARP) and Skia draws on the CPU.
    continue-on-error: ${{ matrix.allow_fail }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            allow_fail: false
          - os: ubuntu-22.04
            platform: linux-x64-gnu
            allow_fail: false
          - os: windows-latest
            platform: win32-x64-msvc
            allow_fail: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Software Vulkan (lavapipe), so that Skia has a device on a runner with no GPU.
      - name: Install a Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true

      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.platform }}
          path: crates/node

      # Artifacts lose the executable bit.
      - name: Make bin/ffmpeg executable
        if: runner.os != 'Windows'
        run: chmod +x crates/node/npm/${{ matrix.platform }}/bin/ffmpeg

      - run: npm ci

      - name: Build the TypeScript packages
        shell: bash
        run: |
          for p in scene compat react core audio video-matting cli; do npm run build -w "packages/$p"; done
          npm run build -w @kinetographdev/studio-ui
          npm run build -w @kinetographdev/studio

      # Packs the packages and the addon, installs them into an empty project outside the repository, renders 30 frames.
      - name: Clean install and render
        run: node scripts/smoke/clean-install.mjs

  # WebGPU through Dawn (KINETOGRAPH_WEBGPU=dawn) on the three platforms' own backends: Metal, Vulkan on SwiftShader (the Linux runner
  # has the Vulkan loader and no driver, so the SwiftShader of the platform package is the only one), Direct3D 12 on WARP.
  dawn:
    name: dawn (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-22.04
            platform: linux-x64-gnu
          - os: windows-latest
            platform: win32-x64-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The loader only: no Mesa driver, so Dawn finds no adapter of its own on a runner with no GPU.
      - name: Install the Vulkan loader, without a driver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 vulkan-tools
          vulkaninfo --summary || true

      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.platform }}
          path: crates/node

      # Artifacts lose the executable bit.
      - name: Make bin/ffmpeg executable
        if: runner.os != 'Windows'
        run: chmod +x crates/node/npm/${{ matrix.platform }}/bin/ffmpeg

      - run: npm ci

      - name: Build the TypeScript packages
        shell: bash
        run: |
          for p in scene compat react core audio video-matting cli; do npm run build -w "packages/$p"; done

      # WebGPU through Dawn (dawn.node of the platform package, KINETOGRAPH_WEBGPU=dawn): the adapter tests, the rendered cases on
      # the built CLI and addon, and the goldens. These runners have no GPU, so Dawn takes its software adapter
      # (packages/compat/src/shim/webgpu-dawn.ts, dawn-software.ts): on Linux SwiftShader, from the `angle/` folder of the platform package
      # (this job installs the Vulkan loader and no driver: no lavapipe), on Windows WARP.
      # On macOS it asks Metal for the runner's own (virtual) GPU (a run of this job showed one there). The goldens are Metal's and skip off macOS, saying so. The tests skip when dawn.node does not load, so the first step
      # makes that a failure instead; the second prints which backend and adapter Dawn took.
      - name: Dawn loads
        shell: bash
        working-directory: packages/cli
        run: node --input-type=module -e "import { loadDawnBinary } from '@kinetographdev/compat/shim'; loadDawnBinary(import.meta.url); console.log('Dawn loads on', process.platform, process.arch)"

      # Informational: `doctor` gives up on a renderer that has not started after a minute, and on Windows (Direct3D 12
      # WARP) the renderer needs longer, so its exit code is not a result.
      - name: Which adapter Dawn takes
        shell: bash
        timeout-minutes: 5
        continue-on-error: true
        env:
          KINETOGRAPH_WEBGPU: dawn
        run: node packages/cli/dist/cli.js doctor

      - name: Test WebGPU through Dawn
        shell: bash
        timeout-minutes: 45
        run: |
          (cd packages/compat && npx vitest run test/webgpu-dawn-adapter.test.ts test/webgpu-dawn-copies.test.ts test/webgpu-dawn-load.test.ts)
          # Every CLI process starts the engine's own renderer, which on Windows (WARP) takes minutes (the clean install and
          # render step below takes most of an hour), so Windows runs the one rendered case that needs a single process.
          if [ "$RUNNER_OS" = Windows ]; then
            (cd packages/cli && npx vitest run --reporter=verbose -t drawImage test/webgpu-dawn.test.ts)
          else
            # The engine's own renderer (wgpu) needs a Vulkan driver in every CLI process, and has no SwiftShader switch of its own:
            # on Linux the loader is told to read SwiftShader's ICD file, the only driver on this runner (Dawn then takes it as well).
            if [ "$RUNNER_OS" = Linux ]; then export VK_DRIVER_FILES="$GITHUB_WORKSPACE/crates/node/npm/linux-x64-gnu/angle/vk_swiftshader_icd.json"; fi
            (cd packages/cli && npx vitest run --reporter=verbose test/webgpu-dawn.test.ts test/webgpu-dawn-golden.test.ts)
          fi

  js:
    name: typecheck and test (JS)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: bindings-linux-x64-gnu
          path: crates/node
      - run: npm ci
      # In dependency order. Never `npm run build --workspaces`: it would also build the site and the addon.
      - name: Typecheck (tsc builds)
        run: |
          for p in scene compat react core audio video-matting cli studio plugins/gsap plugins/p5-brush plugins/anime plugins/motion; do npm run build -w "packages/$p"; done
      # The tests open no GPU unless KINETOGRAPH_GPU_TESTS is set. Not blocking until a run has shown they pass here.
      - name: Test
        continue-on-error: true
        run: |
          for p in scene compat react core audio video-matting cli studio plugins/gsap plugins/p5-brush plugins/anime plugins/motion; do npm test -w "packages/$p"; done
