# Builds the native addon (Rust, Skia, ffmpeg) on macOS, Linux and Windows, then installs it the way a user would and
# renders a few frames. The Linux and Windows builds had never been run when this file was written: expect to fix them.
name: native

on:
  # main only: a branch is built through its pull request, so a push to one does not build twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The ffmpegs that scripts/build-ffmpeg.sh (LGPL, linked into the addon) and scripts/build-ffmpeg-gpl.sh (GPL, the
  # separate bin/ffmpeg program) build, and their cache key part.
  FFMPEG_CACHE_VERSION: v4

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Build dependencies. Skia needs no source build: rust-skia publishes graphite + vulkan (Linux, Windows) and
      # graphite + metal (macOS) binaries. dotlottie's ThorVG is compiled with clang++, ffmpeg-sys-next's bindings with
      # libclang, openh264 and libvpx (x86) with nasm.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config nasm make git cmake

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf cmake

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: >-
            make
            diffutils
            git
            pkgconf
            nasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-make

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_CACHE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      # LGPL-only static ffmpeg (no libx264/libx265), see the header of the script.
      - name: Build ffmpeg (macOS, Linux)
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"

      # MSVC's compiler on the PATH first, then ffmpeg's configure from MSYS2. MSYS2's link.exe would shadow MSVC's.
      - name: Load the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          rm -f /usr/bin/link.exe
          scripts/build-ffmpeg.sh "$(cygpath -u "$RUNNER_TEMP")/ffmpeg"

      # The GPL ffmpeg program that ships in the platform package as bin/ffmpeg, for libx264 and libx265. A separate
      # executable the addon runs as a child process; never linked. It builds with gcc (MinGW-w64 on Windows).
      - name: Cache the GPL ffmpeg
        id: ffmpeg-gpl-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-gpl
          key: ffmpeg-gpl-${{ env.FFMPEG_CACHE_VERSION }}-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg-gpl.sh') }}

      - name: Build the GPL ffmpeg (macOS, Linux)
        if: runner.os != 'Windows' && steps.ffmpeg-gpl-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg-gpl.sh "$RUNNER_TEMP/ffmpeg-gpl"

      - name: Build the GPL ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-gpl-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg-gpl.sh "$(cygpath -u "$RUNNER_TEMP")/ffmpeg-gpl"

      # Into the platform package, where npm packs it from (ignored by the repository) and where the CLI looks for it.
      - name: Place the GPL ffmpeg in the platform package
        shell: bash
        run: |
          d=crates/node/npm/${{ matrix.platform }}/bin
          mkdir -p "$d"
          cp "$RUNNER_TEMP"/ffmpeg-gpl/bin/ffmpeg* "$d/"
          cp "$RUNNER_TEMP/ffmpeg-gpl/SOURCES.txt" "$d/SOURCES.txt"
          ls -l "$d"
          "$d"/ffmpeg* -hide_banner -version | head -3
          "$d"/ffmpeg* -hide_banner -encoders | grep -E 'libx264|libx265|libvpx'
          "$d"/ffmpeg* -hide_banner -encoders | grep libx264
          # Raw pictures in on a pipe, an H.264 file out: how the addon uses it.
          head -c 115200 /dev/zero | "$d"/ffmpeg* -hide_banner -loglevel error -f rawvideo -pix_fmt yuv420p -s 160x120 -framerate 30 -i pipe:0 -c:v libx264 -f mp4 "$RUNNER_TEMP/probe.mp4"
          test -s "$RUNNER_TEMP/probe.mp4"

      - run: npm ci

      - name: Build the addon (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: npm run build:release -w @kinetographdev/native -- --target ${{ matrix.target }} --features ffmpeg-static

      - name: Build the addon (Windows)
        if: runner.os == 'Windows'
        env:
          FFMPEG_DIR: ${{ runner.temp }}\ffmpeg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: npm run build:release -w @kinetographdev/native -- --target ${{ matrix.target }} --features ffmpeg-static

      # Blender's tracker (libmv, Ceres and Eigen, crates/libmv-sys) is C++ that the cc crate builds into the addon: GCC
      # on Linux, MSVC on Windows, clang on macOS. The tests track synthetic pictures, and real footage against the
      # platform's golden (crates/track/tests/goldens; a platform without one prints what it got). Same target and
      # features as the addon build, so the Rust dependencies are reused.
      - name: Test the tracker (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/ffmpeg/lib/pkgconfig
        run: cargo test --release --target ${{ matrix.target }} -p libmv-sys -p kinetograph-track --features kinetograph-track/ffmpeg-static -- --nocapture

      - name: Test the tracker (Windows)
        if: runner.os == 'Windows'
        env:
          FFMPEG_DIR: ${{ runner.temp }}\ffmpeg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo test --release --target ${{ matrix.target }} -p libmv-sys -p kinetograph-track --features kinetograph-track/ffmpeg-static -- --nocapture

      - name: Libraries the addon links
        shell: bash
        run: |
          f=crates/node/kinetograph.${{ matrix.platform }}.node
          ls -l "$f"
          case "$RUNNER_OS" in
            macOS) otool -L "$f" ;;
            Linux) ldd "$f" ;;
            Windows) dumpbin //dependents "$f" || true ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.platform }}
          path: |
            crates/node/kinetograph.${{ matrix.platform }}.node
            crates/node/npm/${{ matrix.platform }}/bin
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    # Windows runners have no GPU and no Vulkan driver: wgpu uses Direct3D 12 (WARP) and Skia draws on the CPU.
    continue-on-error: ${{ matrix.allow_fail }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            allow_fail: false
          - os: ubuntu-22.04
            platform: linux-x64-gnu
            allow_fail: false
          - os: windows-latest
            platform: win32-x64-msvc
            allow_fail: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Software Vulkan (lavapipe), so that Skia has a device on a runner with no GPU.
      - name: Install a Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true

      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.platform }}
          path: crates/node

      # Artifacts lose the executable bit.
      - name: Make bin/ffmpeg executable
        if: runner.os != 'Windows'
        run: chmod +x crates/node/npm/${{ matrix.platform }}/bin/ffmpeg

      - run: npm ci

      - name: Build the TypeScript packages
        shell: bash
        run: |
          for p in scene compat react core audio cli; do npm run build -w "packages/$p"; done

      # Packs the packages and the addon, installs them into an empty project outside the repository, renders 30 frames.
      - name: Clean install and render
        run: node scripts/smoke/clean-install.mjs

  js:
    name: typecheck and test (JS)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: bindings-linux-x64-gnu
          path: crates/node
      - run: npm ci
      # In dependency order. Never `npm run build --workspaces`: it would also build the site and the addon.
      - name: Typecheck (tsc builds)
        run: |
          for p in scene compat react core audio cli studio plugins/gsap plugins/p5-brush plugins/anime plugins/motion; do npm run build -w "packages/$p"; done
      # The tests open no GPU unless KINETOGRAPH_GPU_TESTS is set. Not blocking until a run has shown they pass here.
      - name: Test
        continue-on-error: true
        run: |
          for p in scene compat react core audio cli studio plugins/gsap plugins/p5-brush plugins/anime plugins/motion; do npm test -w "packages/$p"; done
